<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고등학생 휴식 시설 지도</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 스크롤바 디자인 커스텀 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">🎒 고등학생 힐링 스팟 찾기</h1>
        <p class="text-sm text-indigo-200">현재 위치 기반 주변 휴식 시설 검색</p>
    </header>

    <!-- 메인 컨텐츠 영역 (2분할: 왼쪽 검색 및 리스트 / 오른쪽 지도) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- 왼쪽 패널 (검색창, 카테고리, 결과 목록) -->
        <section class="w-full md:w-96 bg-white shadow-lg flex flex-col z-10">
            <!-- 검색 입력창 -->
            <div class="p-4 border-b border-gray-200">
                <form id="searchForm" class="flex gap-2">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="예: 강남 노래방, 역삼 PC방" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                    >
                    <button 
                        type="submit" 
                        class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium transition"
                    >
                        검색
                    </button>
                </form>

                <!-- 카테고리 버튼 필터 -->
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <button type="button" data-category="노래방" class="category-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-700 py-1.5 px-2 rounded-md text-xs font-medium transition border border-gray-200 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-microphone text-pink-600"></i> 노래방
                    </button>
                    <button type="button" data-category="볼링장" class="category-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-700 py-1.5 px-2 rounded-md text-xs font-medium transition border border-gray-200 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-bowling-ball text-amber-600"></i> 볼링장
                    </button>
                    <button type="button" data-category="당구장" class="category-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-700 py-1.5 px-2 rounded-md text-xs font-medium transition border border-gray-200 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-circle text-emerald-600"></i> 당구장
                    </button>
                    <button type="button" data-category="PC방" class="category-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-700 py-1.5 px-2 rounded-md text-xs font-medium transition border border-gray-200 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-desktop text-blue-600"></i> PC방
                    </button>
                </div>
            </div>

            <!-- 검색 결과 리스트 -->
            <div id="placeListContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="text-center text-gray-400 mt-10 text-sm">
                    원하는 카테고리를 선택하거나<br>검색어를 입력해 주세요!
                </div>
            </div>
        </section>

        <!-- 오른쪽 패널 (카카오맵 지도) -->
        <section class="flex-1 relative h-full">
            <div id="map" class="w-full h-full"></div>
        </section>

    </main>

    <!-- 카카오 맵 자바스크립트 SDK -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=601de94737a3af4b1dbb7602c20412cf&libraries=services,clusterer,drawing&autoload=false"></script>

    <!-- 커스텀 자바스크립트 로직 -->
    <script>
        // 전역 변수 설정
        let mapInstance = null;         // 지도 객체
        let placesService = null;       // 장소 검색 객체
        let markersList = [];           // 지도에 표시된 마커들을 담을 배열
        let currentInfowindow = null;   // 열려있는 인포윈도우 객체
        let currentActiveCategory = ''; // 현재 선택된 카테고리

        // DOM 로드 완료 후 실행
        document.addEventListener('DOMContentLoaded', function() {
            kakao.maps.load(function() {
                initMap();
            });
        });

        // 지도 초기화 및 위치 권한 처리
        function initMap() {
            const mapContainerNode = document.getElementById('map');
            
            let defaultLatitude = 37.566826;
            let defaultLongitude = 126.9786567;

            const mapOptionConfig = {
                center: new kakao.maps.LatLng(defaultLatitude, defaultLongitude),
                level: 5 // 지도 확대 레벨 5 조건
            };

            mapInstance = new kakao.maps.Map(mapContainerNode, mapOptionConfig);
            placesService = new kakao.maps.services.Places(mapInstance);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const userLatitude = position.coords.latitude;
                        const userLongitude = position.coords.longitude;
                        const currentPositionCoords = new kakao.maps.LatLng(userLatitude, userLongitude);
                        
                        mapInstance.setCenter(currentPositionCoords);
                        displayUserMarker(currentPositionCoords);
                    },
                    function(error) {
                        console.warn('위치 권한 거부 또는 실패. 기본 위치로 설정합니다.', error);
                    }
                );
            }

            initEventListeners();
        }

        // 현재 위치 마커 표시
        function displayUserMarker(coords) {
            const markerContent = document.createElement('div');
            markerContent.className = 'bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full shadow-lg border-2 border-white font-bold flex items-center gap-1';
            markerContent.innerHTML = '<i class="fa-solid fa-location-dot"></i> 내 위치';

            const customOverlay = new kakao.maps.CustomOverlay({
                position: coords,
                content: markerContent,
                yAnchor: 1.5
            });
            customOverlay.setMap(mapInstance);
        }

        // 이벤트 리스너 등록
        function initEventListeners() {
            const searchFormElement = document.getElementById('searchForm');
            searchFormElement.addEventListener('submit', function(event) {
                event.preventDefault();
                const keywordInput = document.getElementById('searchInput');
                const keywordValue = keywordInput.value.trim();

                if (!keywordValue) {
                    alert('검색어를 입력해주세요!');
                    return;
                }
                currentActiveCategory = keywordValue;
                searchPlacesByKeyword(keywordValue);
            });

            const categoryButtons = document.querySelectorAll('.category-btn');
            categoryButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const categoryQuery = this.getAttribute('data-category');
                    document.getElementById('searchInput').value = categoryQuery;
                    currentActiveCategory = categoryQuery;
                    searchPlacesByKeyword(categoryQuery);
                });
            });
        }

        // 키워드 장소 검색
        function searchPlacesByKeyword(keyword) {
            const currentCenterCoords = mapInstance.getCenter();
            const searchOptions = {
                location: currentCenterCoords,
                radius: 5000
            };
            placesService.keywordSearch(keyword, placesSearchCallback, searchOptions);
        }

        // 검색 결과 콜백
        function placesSearchCallback(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlacesList(data);
                displayPlacesOnMap(data, currentActiveCategory);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                document.getElementById('placeListContainer').innerHTML = `
                    <div class="text-center text-gray-400 mt-10 text-sm">
                        검색 결과가 없습니다.<br>다른 키워드로 검색해 보세요!
                    </div>
                `;
                clearAllMarkers();
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // [수정됨] 핀 모양(동그란 머리 + 아래 삼각형 꼬리) 내부 아이콘 SVG 생성 함수
        function createMarkerImage(category) {
            let pinColor = '#db2777';   // 기본 핑크 (노래방)
            // 각 카테고리별 아이콘의 SVG 경로(path) 데이터 정의
            let iconPathSvg = '<path fill="#ffffff" d="M176 0c-35.3 0-64 28.7-64 64v112c0 35.3 28.7 64 64 64s64-28.7 64-64V64c0-35.3-28.7-64-64-64zM16 192c0-8.8 7.2-16 16-16s16 7.2 16 16c0 70.7 57.3 128 128 128s128-57.3 128-128c0-8.8 7.2-16 16-16s16 7.2 16 16c0 83.6-64 152.4-144 162.8V416h32c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16h32V354.8C96 344.4 32 275.6 32 192z"/>'; // 노래방(마이크)

            if (category.includes('노래방')) {
                pinColor = '#db2777'; // 핑크
                iconPathSvg = '<path fill="#ffffff" d="M176 0c-35.3 0-64 28.7-64 64v112c0 35.3 28.7 64 64 64s64-28.7 64-64V64c0-35.3-28.7-64-64-64zM16 192c0-8.8 7.2-16 16-16s16 7.2 16 16c0 70.7 57.3 128 128 128s128-57.3 128-128c0-8.8 7.2-16 16-16s16 7.2 16 16c0 83.6-64 152.4-144 162.8V416h32c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16h32V354.8C96 344.4 32 275.6 32 192z"/>';
            } else if (category.includes('볼링장')) {
                pinColor = '#d97706'; // 주황
                iconPathSvg = '<path fill="#ffffff" d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-96 64C57.3 320 0 377.3 0 448c0 8.8 7.2 16 16 16h416c8.8 0 16-7.2 16-16c0-70.7-57.3-128-128-128H128zM304 96a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm-128 32a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm96 48a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/>';
            } else if (category.includes('당구장')) {
                pinColor = '#059669'; // 초록
                iconPathSvg = '<path fill="#ffffff" d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512z"/>';
            } else if (category.includes('PC방')) {
                pinColor = '#2563eb'; // 파랑
                iconPathSvg = '<path fill="#ffffff" d="M64 0C28.7 0 0 28.7 0 64V352c0 35.3 28.7 64 64 64H224v32H160c-17.7 0-32 14.3-32 32s14.3 32 32 32H352c17.7 0 32-14.3 32-32s-14.3-32-32-32H288V416H448c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64zM64 64H448V352H64V64z"/>';
            }

            // 정확한 지도 핀 모양(위쪽 동그라미 + 아래쪽 뾰족한 삼각형) 내부에 아이콘이 쏙 들어가도록 만든 SVG 구조
            const svgString = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="40" height="50">
                    <!-- 지도 핀 외곽선 및 배경 (동그라미 + 아래로 향하는 삼각형 꼬리) -->
                    <path fill="${pinColor}" stroke="#ffffff" stroke-width="20" d="M200 0C90 0 0 90 0 200c0 110 200 300 200 300s200-190 200-300C400 90 310 0 200 0z"/>
                    <!-- 동그라미 중앙에 위치할 카테고리 아이콘 (크기와 위치 최적화) -->
                    <g transform="translate(100, 70) scale(0.55)">
                        ${iconPathSvg}
                    </g>
                </svg>
            `;

            const imageSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const imageSize = new kakao.maps.Size(40, 50); // 마커 이미지 크기
            const imageOption = { offset: new kakao.maps.Point(20, 50) }; // 핀의 맨 아랫점이 정확히 좌표를 가리키도록 설정

            return new kakao.maps.MarkerImage(imageSrc, imageSize, imageOption);
        }

        // 지도에 진짜 '마커(핀)'를 생성하고 표시하는 함수
        function displayPlacesOnMap(places, category) {
            clearAllMarkers(); // 기존 마커 초기화

            const boundsRange = new kakao.maps.LatLngBounds();

            for (let i = 0; i < places.length; i++) {
                const placeItem = places[i];
                const placeCoords = new kakao.maps.LatLng(placeItem.y, placeItem.x);

                // 카테고리별 맞춤형 핀 이미지 생성
                const markerImage = createMarkerImage(category);

                // 카카오 기본 마커 객체 생성 (image 옵션 적용)
                const marker = new kakao.maps.Marker({
                    map: mapInstance,
                    position: placeCoords,
                    image: markerImage
                });

                markersList.push(marker);
                boundsRange.extend(placeCoords);

                // 마커 클릭 시 나타날 정보 창(인포윈도우)
                const infowindow = new kakao.maps.InfoWindow({
                    content: `<div style="padding:8px;font-size:12px;font-weight:bold;width:160px;">
                                <div style="color:#4f46e5; margin-bottom:2px;">${placeItem.place_name}</div>
                                <div style="font-size:11px; font-weight:normal; color:#666;">${placeItem.road_address_name || placeItem.address_name}</div>
                              </div>`
                });

                // 마커 클릭 이벤트 리스너 연결
                kakao.maps.event.addListener(marker, 'click', function() {
                    if (currentInfowindow) {
                        currentInfowindow.close();
                    }
                    infowindow.open(mapInstance, marker);
                    currentInfowindow = infowindow;

                    // 클릭한 곳으로 지도 중심 이동 및 확대
                    mapInstance.setCenter(placeCoords);
                    mapInstance.setLevel(3);
                });
            }

            // 마커들이 모두 보이도록 지도 범위 조정
            mapInstance.setBounds(boundsRange);
        }

        // 지도 위 모든 마커 제거 함수
        function clearAllMarkers() {
            for (let i = 0; i < markersList.length; i++) {
                markersList[i].setMap(null);
            }
            markersList = [];
        }

        // 왼쪽 패널 리스트 렌더링
        function displayPlacesList(places) {
            const listContainerNode = document.getElementById('placeListContainer');
            listContainerNode.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placeItem = places[i];
                
                const listItemCard = document.createElement('div');
                listItemCard.className = 'p-3 bg-gray-100 border border-gray-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 transition cursor-pointer shadow-sm';
                
                listItemCard.innerHTML = `
                    <h3 class="font-bold text-gray-800 text-sm mb-1">${placeItem.place_name}</h3>
                    <p class="text-xs text-gray-500 mb-1">${placeItem.road_address_name || placeItem.address_name}</p>
                    <p class="text-xs text-indigo-600 font-medium">${placeItem.phone || '전화번호 없음'}</p>
                `;

                // 리스트 클릭 시 해당 마커 위치로 이동
                listItemCard.addEventListener('click', function() {
                    const moveCoords = new kakao.maps.LatLng(placeItem.y, placeItem.x);
                    mapInstance.setCenter(moveCoords);
                    mapInstance.setLevel(3);
                });

                listContainerNode.appendChild(listItemCard);
            }
        }
    </script>
</body>
</html>
