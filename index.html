<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 전국 노래방 지도</title>
    <!-- Tailwind CSS CDN (화면 디자인용) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 text-white p-4 font-bold text-lg shadow-md flex items-center justify-between">
        <span>🎤 전국 노래방 & 코인노래방 지도</span>
        <span class="text-xs font-normal bg-indigo-500 px-2.5 py-1 rounded-full shadow">Kakao Map API</span>
    </header>

    <!-- 전체 화면 2분할 레이아웃 -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- 왼쪽 영역: 검색창 및 결과 리스트 (너비 1/3) -->
        <section class="w-1/3 bg-white border-r border-gray-200 flex flex-col z-10 shadow-lg">
            <!-- 검색 입력폼 -->
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <form id="search-form" class="flex gap-2">
                    <input 
                        type="text" 
                        id="search-input" 
                        value="코인노래방" 
                        placeholder="지역 또는 노래방 입력 (예: 홍대 코인노래방)" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                        required
                    >
                    <button 
                        type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition"
                    >
                        검색
                    </button>
                </form>
                <p class="text-xs text-gray-400 mt-2">💡 지역명을 함께 검색하면 더 정확해요! (예: 강남 코인노래방)</p>
            </div>

            <!-- 검색 결과 리스트 출력 영역 -->
            <div id="result-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <div class="p-4 text-center text-gray-400 text-sm">
                    지도를 불러오는 중입니다...
                </div>
            </div>
        </section>

        <!-- 오른쪽 영역: 지도 표시 (너비 2/3) -->
        <section class="w-2/3 relative">
            <div id="map" class="w-full h-full"></div>
            <!-- 현재 위치 로딩 안내 배지 -->
            <div id="loading-badge" class="absolute top-4 right-4 bg-white/90 px-3 py-1.5 rounded-full shadow-md text-xs font-medium text-gray-700 z-20">
                📍 현재 위치 확인 중...
            </div>
        </section>

    </main>

    <!-- 카카오맵 JavaScript SDK 로드 (libraries=services 필수) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=601de94737a3af4b1dbb7602c20412cf&libraries=services"></script>
    
    <!-- 자바스크립트 비즈니스 로직 -->
    <script>
        // DOM 요소 및 전역 변수 설정
        var mapContainer = document.getElementById('map');
        var map;
        var markers = []; // 지도에 뿌려진 마커들을 관리할 배열

        // 초기 지도 옵션 (기본 서울 중심, 확대 레벨 5)
        var mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), 
            level: 5 
        };

        // 카카오맵 라이브러리가 완전히 로드된 후 실행
        kakao.maps.load(function() {
            // 1. 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOption);

            // 2. 장소 검색 객체 생성 (키워드 검색 라이브러리)
            var ps = new kakao.maps.services.Places(map);

            // 3. 접속자의 현재 위치 가져오기 (Geolocation API)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;  // 위도
                    var lon = position.coords.longitude; // 경도

                    var currentPos = new kakao.maps.LatLng(lat, lon);
                    
                    // 지도 중심을 현재 내 위치로 이동
                    map.setCenter(currentPos);

                    document.getElementById('loading-badge').innerText = '📍 내 주변 노래방 검색 중...';
                    
                    // 현재 위치를 기준으로 기본 '코인노래방' 검색 실행!
                    ps.keywordSearch('코인노래방', placesSearchCB, {
                        location: currentPos,
                        radius: 5000 // 반경 5km 이내 우선 검색
                    });

                }, function(error) {
                    console.warn('위치 권한 거부 또는 실패. 기본 지역(홍대)으로 검색합니다.');
                    document.getElementById('loading-badge').innerText = '⚠️ 기본 지역(홍대) 검색';
                    
                    // 위치를 못 가져오면 기본 키워드로 검색
                    ps.keywordSearch('홍대 코인노래방', placesSearchCB);
                });
            } else {
                ps.keywordSearch('코인노래방', placesSearchCB);
            }

            // 상단 안내 배지 숨기기 타이머
            setTimeout(() => {
                var badge = document.getElementById('loading-badge');
                if(badge) badge.style.display = 'none';
            }, 3000);

            // 4. 검색 폼 제출 이벤트 (사용자가 직접 검색어 입력 시)
            var searchForm = document.getElementById('search-form');
            searchForm.addEventListener('submit', function(e) {
                e.preventDefault(); // 새로고침 방지
                
                var keyword = document.getElementById('search-input').value.trim();
                if (!keyword) return;

                // 입력한 키워드로 장소 검색
                ps.keywordSearch(keyword, placesSearchCB);
            });

            // 5. 장소 검색 결과를 받아 처리하는 콜백 함수
            function placesSearchCB(data, status, pagination) {
                if (status === kakao.maps.services.Status.OK) {
                    displayPlaces(data); // 정상일 때 화면에 표시
                } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                    alert('검색 결과가 존재하지 않습니다. 다른 검색어로 시도해 보세요!');
                    document.getElementById('result-list').innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">검색 결과가 없습니다.</div>';
                    removeMarkers();
                } else if (status === kakao.maps.services.Status.ERROR) {
                    alert('검색 중 오류가 발생했습니다.');
                }
            }

            // 6. 검색된 장소들을 리스트와 지도 마커로 렌더링하는 함수
            function displayPlaces(places) {
                var listEl = document.getElementById('result-list');
                listEl.innerHTML = ''; // 이전 검색 결과 초기화
                removeMarkers();       // 이전 지도 마커 초기화

                var bounds = new kakao.maps.LatLngBounds(); // 지도 범위를 재설정하기 위한 객체

                for (var i = 0; i < places.length; i++) {
                    var place = places[i];
                    var placePosition = new kakao.maps.LatLng(place.y, place.x);
                    
                    // 마커 생성
                    var marker = addMarker(placePosition, i);
                    bounds.extend(placePosition); // 모든 마커가 보이도록 범위에 추가

                    // 왼쪽 리스트 아이템 HTML 동적 생성
                    var itemEl = document.createElement('div');
                    itemEl.className = 'p-4 hover:bg-indigo-50 cursor-pointer border-b border-gray-100 transition';
                    itemEl.innerHTML = `
                        <div class="flex items-center justify-between">
                            <h4 class="font-bold text-gray-800 text-sm">${i + 1}. ${place.place_name}</h4>
                            <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">노래방</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">📍 ${place.road_address_name || place.address_name}</p>
                        <p class="text-xs text-indigo-600 font-medium mt-0.5">📞 ${place.phone || '전화번호 없음'}</p>
                    `;

                    // 리스트 항목 클릭 시 해당 위치로 지도 중심 이동 및 확대
                    itemEl.addEventListener('click', (function(targetPosition) {
                        return function() {
                            map.setCenter(targetPosition);
                            map.setLevel(3); // 클릭한 곳 확대
                        };
                    })(placePosition));

                    listEl.appendChild(itemEl);
                }

                // 검색된 모든 마커가 한눈에 보이도록 지도 범위 조정
                map.setBounds(bounds);
            }

            // 마커를 생성하고 지도에 꽂는 함수
            function addMarker(position, idx) {
                var marker = new kakao.maps.Marker({
                    position: position
                });
                marker.setMap(map);
                markers.push(marker); // 추후 삭제를 위해 배열에 저장
                return marker;
            }

            // 지도에 있는 모든 마커를 지우는 함수
            function removeMarkers() {
                for (var i = 0; i < markers.length; i++) {
                    markers[i].setMap(null);
                }
                markers = [];
            }
        });
    </script>
</body>
</html>
